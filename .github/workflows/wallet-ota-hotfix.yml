name: "📡 Ship Wallet OTA"

# Frontend-only update for the PRODUCTION wallet, shipped through CrabNebula
# Cloud without a store review.
#
# Run it by hand on `main`, after a dev → main merge: Actions → "Ship Wallet OTA".
# It patches the latest production store release on GitHub (`app-*`, not a
# prerelease), not the version `main` carries (dev's). That release is created
# at upload, before store review.
#
# The guard pins the version-only native files to that release, then refuses
# anything that still differs under `src-tauri/` or bumps a Tauri plugin package.
#
# The store release workflow (`tauri-mobile-release.yml`) deliberately does NOT
# publish an OTA baseline: assets identical to the embedded ones would make
# every install download the whole archive for nothing.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Which installed binaries to patch"
        required: true
        type: choice
        options:
          - both
          - ios
          - android
        default: both
      notes:
        description: "Release notes shown in CrabNebula Cloud"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  CI: true

defaults:
  run:
    shell: bash

jobs:
  guard:
    name: "🛡️ Verify OTA-safe"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags: the guard diffs this tree against the tag.
          fetch-depth: 0
          persist-credentials: false

      # An OTA bundle can only ever replace web assets. Anything under
      # `src-tauri/` — Rust, `capabilities/`, native config — is compiled into
      # the installed binary and CANNOT be shipped this way. A device that
      # pulled assets calling a command, or relying on a capability, that its
      # binary lacks is broken until the user takes a store update.
      #
      # Dev releases bump the version in native files, so a raw diff against the
      # production tag is never empty after a dev → main merge. Pinning those
      # version sites to the tag first leaves only real native changes.
      - name: "🛡️ Check the tree is OTA-safe"
        id: check
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run this from main, not $GITHUB_REF_NAME."
            exit 1
          fi

          TAG=$(gh release list --exclude-pre-releases --exclude-drafts --limit 100 \
            --json tagName --jq '[.[].tagName | select(startswith("app-"))][0] // empty')
          if [ -z "$TAG" ]; then
            echo "::error::No published production release tagged app-* found."
            exit 1
          fi
          VERSION=${TAG#app-}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG does not exist in this repository."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$TAG" HEAD; then
            echo "::error::HEAD does not descend from $TAG."
            exit 1
          fi

          apps/wallet/scripts/pin-native-version.sh "$VERSION"

          if ! git diff --quiet "$TAG" -- apps/wallet/src-tauri; then
            echo "::error::Native changes since $TAG — this needs a store release, not an OTA:"
            git diff --name-only "$TAG" -- apps/wallet/src-tauri | sed 's/^/  /'
            exit 1
          fi

          # The JS halves of native plugins are versioned with their Rust side.
          GUEST_BUMPS=$(git diff "$TAG" HEAD -- bun.lock apps/wallet/package.json \
            | grep -E '^[-+][^-+].*(@tauri-apps/|@crabnebula/|tauri-plugin-)' || true)
          if [ -n "$GUEST_BUMPS" ]; then
            echo "::error::Tauri plugin packages changed since $TAG — this needs a store release, not an OTA:"
            echo "$GUEST_BUMPS"
            exit 1
          fi

          if git diff --quiet "$TAG" -- apps/wallet packages sdk package.json bun.lock; then
            echo "::error::Nothing to ship: the web assets are identical to $TAG."
            exit 1
          fi

          echo "[ci] $TAG → HEAD is web-assets-only, safe to ship over the air"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  upload:
    name: "📡 ${{ matrix.platform }} ${{ needs.guard.outputs.version }} → prod"
    needs: guard
    # Waits for one approval from any of this environment's required reviewers.
    environment: ota-prod
    runs-on: ubuntu-latest
    strategy:
      # Sequential: both legs run `ota-updater upload` against the same Cloud
      # app and the CLI makes no concurrency guarantee.
      max-parallel: 1
      fail-fast: false
      matrix:
        platform: ${{ inputs.platform == 'both' && fromJSON('["ios","android"]') || fromJSON(format('["{0}"]', inputs.platform)) }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: "🟢 Setup Node"
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: "🧅 Setup Bun"
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: "💾 Cache Bun modules"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: "📦 Install dependencies"
        run: bun install --frozen-lockfile

      # The build and the CLI must see the production version, not the one main carries.
      - name: "📌 Pin the production version"
        run: apps/wallet/scripts/pin-native-version.sh "$VERSION"
        env:
          VERSION: ${{ needs.guard.outputs.version }}

      - name: "🔗 Add node_modules binaries to PATH"
        run: |
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
          echo "$PWD/apps/wallet/node_modules/.bin" >> "$GITHUB_PATH"

      - name: "🏗️ Build SDK packages"
        run: bun run build:sdk

      - name: "👥 Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::262732185023:role/github-action-deploy-role
          aws-region: eu-west-1
          retry-max-attempts: 5

      # Mirrors `beforeBuildCommand` in tauri.conf.json EXACTLY. `bun run build`
      # is wrong here: it also emits the service worker and the standalone
      # /sharing + /install pages, which the binary never embedded, so the OTA
      # bundle would not match the asset set it replaces.
      # TAURI_ENV_PLATFORM drives __IS_IOS__ / __IS_ANDROID__ and, with STAGE,
      # the __OTA_CHANNEL__ define this bundle will be published under.
      - name: "🏗️ Build wallet frontend"
        run: |
          sst shell --stage "$STAGE" --print-logs -- bash -c \
            "cd apps/wallet && NODE_ENV=production TAURI_CLI_RUNNING=1 TAURI_ENV_PLATFORM=$PLATFORM vite build"
        env:
          STAGE: prod
          FRAK_VARIANT: prod
          PLATFORM: ${{ matrix.platform }}

      # Channel must match __OTA_CHANNEL__ from vite.defines.ts, or the bundle
      # lands where no device is listening.
      - name: "📡 Upload OTA bundle"
        working-directory: apps/wallet
        run: |
          set -euo pipefail
          CHANNEL="$STAGE-$PLATFORM-${VERSION//./-}"
          echo "[ci] publishing to channel $CHANNEL"
          ARGS=(--channel "$CHANNEL")
          if [ -n "$NOTES" ]; then
            ARGS+=(--notes "$NOTES")
          fi
          bunx ota-updater upload "${ARGS[@]}"
        env:
          STAGE: prod
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.guard.outputs.version }}
          NOTES: ${{ inputs.notes }}
          PRIVATE_KEY: ${{ secrets.OTA_SIGNING_PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.OTA_SIGNING_PRIVATE_KEY_PASSWORD }}
          CN_API_KEY: ${{ secrets.CN_API_KEY }}
