# Publishes sdk/ios to the SwiftPM mirror at frak-id/frak-ios-sdk.
#
# Why a mirror at all: SwiftPM resolves a package by repo URL + tag and reads
# `Package.swift` from the repo ROOT only — there is no subpath form, and the upstream
# request (swift-package-manager#5768) is open. `sdk/ios/Package.swift` is therefore
# unreachable to a merchant from this monorepo. The mirror's root is sdk/ios's contents.
#
# The mirror is a snapshot, not a history: one orphan commit per release, force-pushed.
# `git subtree split` was the alternative and buys nothing here — nobody bisects an SDK
# mirror, and subtree's cost scales with this monorepo's 204 MiB pack for a 492 KB result.
# The GitHub release on this repo, quoting sdk/ios/CHANGELOG.md, is where the history lives.
#
# Tag convention: `ios-v0.1.0-alpha.1` here becomes `0.1.0-alpha.1` on the mirror. The
# prefix keeps iOS releases out of the JS train's tag namespace; the mirror gets bare
# semver because that is what SwiftPM reads as a version.
#
# Four jobs, cheapest first: `guard` rejects a bad tag on Linux before `verify` spends a
# 10x-billed macOS runner, and `verify` proves the tree compiles before `publish` writes a
# tag nobody can take back.
name: Release iOS SDK

on:
  push:
    tags: ["ios-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the ios-v prefix (e.g. 0.1.0-alpha.1)"
        required: true
      dry_run:
        description: "Stage and validate, but do not push to the mirror"
        type: boolean
        default: true

permissions:
  contents: read

# A second release racing the first would force-push main out from under it.
concurrency:
  group: release-ios-sdk
  cancel-in-progress: false

env:
  MIRROR: git@github.com:frak-id/frak-ios-sdk.git

jobs:
  # Everything that can say no without a build, on the cheap runner.
  guard:
    name: "🍏 iOS SDK · Check the tag and the version sites"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2

      - name: "🔢 Resolve the version"
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#ios-v}"
          fi
          # Semver with an optional prerelease. A malformed tag reaching the mirror is
          # uncorrectable: a published version is never retagged, only superseded.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$version' is not a semver version" && exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Every file carrying the version, against each other and against the CHANGELOG.
      # None of them knows about the tag, so the tag is checked separately below.
      - name: "🔒 Check the version sites and the CHANGELOG"
        run: bun scripts/native-version.ts check ios

      - name: "🔒 Check the tag against FrakSDKVersion.current"
        run: |
          declared=$(bun scripts/native-version.ts version ios)
          if [ "$declared" != "${{ steps.resolve.outputs.version }}" ]; then
            echo "::error::tag says ${{ steps.resolve.outputs.version }}, FrakSDKVersion.current says $declared" && exit 1
          fi

  # apps.yaml runs these on every PR touching sdk/ios, but a tag can be cut from any commit
  # and a published version cannot be withdrawn — so they run again on the exact released tree.
  # macOS is unavoidable: `swift format` and the iphonesimulator SDK both come from Xcode.
  verify:
    name: "🍏 iOS SDK · Lint, build & test the released tree"
    needs: guard
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2

      - name: "💾 Cache SwiftPM build"
        uses: actions/cache@v5
        with:
          path: sdk/ios/.build
          key: ${{ runner.os }}-spm-frak-sdk-${{ hashFiles('sdk/ios/Package.swift', 'sdk/ios/Sources/**', 'sdk/ios/Tests/**') }}
          restore-keys: ${{ runner.os }}-spm-frak-sdk-

      - name: "📏 Lint (swift-format, strict)"
        run: bun run --cwd sdk/ios lint

      # Cross-compiles against the iphonesimulator SDK under Swift 6 strict concurrency. A
      # bare `swift build` would compile this package as macOS and prove nothing about iOS.
      - name: "🔨 Build (iOS simulator triple, Swift 6)"
        run: bun run --cwd sdk/ios build

      - name: "🧪 Tests"
        run: bun run --cwd sdk/ios test

  publish:
    name: "🍏 iOS SDK · Publish to the SwiftPM mirror"
    needs: [guard, verify]
    runs-on: ubuntu-latest
    permissions:
      # The GitHub release, and the ios-v tag it creates on a workflow_dispatch run.
      contents: write
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2

      - name: "📦 Stage the mirror payload"
        run: sdk/ios/scripts/run.sh mirror-stage "$RUNNER_TEMP/mirror"

      - name: "🔑 Authorize the mirror push"
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          # env: indirection, not inline ${{ }}: the expression engine expands
          # secrets into the script text before bash parses it.
          DEPLOY_KEY: ${{ secrets.IOS_MIRROR_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: "🚀 Push to the mirror"
        id: push
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          cd "$RUNNER_TEMP/mirror"
          git init -q -b main .
          git add -A
          git -c user.email=ci@frak.id -c user.name="Frak CI" \
            commit -qm "FrakSDK $VERSION

          Generated from frak-id/wallet@${GITHUB_SHA} (sdk/ios). Do not commit here."
          git tag "$VERSION"

          if [ "$DRY_RUN" = "true" ]; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "### Dry run — nothing pushed" >> "$GITHUB_STEP_SUMMARY"
            git -c core.pager=cat show --stat HEAD >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # A published version is immutable. Refuse rather than clobber a tag a merchant
          # may already have pinned in Package.resolved. This check races the push, so the
          # refspec below carries the real guarantee: main is forced, the tag never is, and
          # git refuses an existing tag on its own.
          if git ls-remote --tags "$MIRROR" "refs/tags/$VERSION" | grep -q .; then
            echo "::error::$VERSION is already tagged on the mirror; bump instead of retagging" && exit 1
          fi

          # One ref transaction, so the tag cannot land without the commit it names, and a
          # refused tag rolls main back instead of leaving the mirror advertising a version
          # that does not resolve.
          git push --atomic "$MIRROR" "+main:refs/heads/main" "refs/tags/$VERSION"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # After the push: the mirror is the artifact, and a release pointing at a tag that does
      # not exist would be the worse failure.
      - name: "📝 Extract the release notes"
        if: steps.push.outputs.pushed == 'true'
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          {
            bun scripts/native-version.ts notes ios
            echo ""
            echo "---"
            echo ""
            echo "Add it with SwiftPM — a prerelease has to be pinned exactly:"
            echo ""
            echo '```swift'
            echo ".package(url: \"https://github.com/frak-id/frak-ios-sdk.git\", exact: \"$VERSION\")"
            echo '```'
          } > "$RUNNER_TEMP/notes.md"

      # On a tag push the tag already exists; on a workflow_dispatch run this creates it at
      # the released SHA, so every published version is reachable from this repo too.
      - name: "🏷️ Create the GitHub release"
        if: steps.push.outputs.pushed == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "ios-v${{ needs.guard.outputs.version }}"
          name: "iOS SDK ${{ needs.guard.outputs.version }}"
          body_path: ${{ runner.temp }}/notes.md
          prerelease: ${{ contains(needs.guard.outputs.version, '-') }}

  # The only thing that ever exercises the merchant spelling. example/native-ios uses a
  # SwiftPM *path* dependency and always will, so without this nothing proves the published
  # form resolves — the first person to find out would otherwise be a merchant.
  # macOS because the package targets Apple platforms; billed at 10x, but only on a release.
  verify-published:
    name: "🍏 iOS SDK · Resolve the published package"
    needs: [guard, publish]
    if: needs.publish.outputs.pushed == 'true'
    runs-on: macos-26
    steps:
      - name: "🔍 Resolve and build as a merchant would"
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          mkdir -p consumer/Sources/App && cd consumer
          cat > Package.swift <<EOF
          // swift-tools-version: 6.0
          import PackageDescription
          let package = Package(
              name: "App",
              platforms: [.iOS(.v15), .macOS(.v12)],
              products: [.library(name: "App", targets: ["App"])],
              dependencies: [
                  .package(url: "https://github.com/frak-id/frak-ios-sdk.git", exact: "$VERSION")
              ],
              targets: [.target(name: "App", dependencies: [
                  .product(name: "FrakSDK", package: "frak-ios-sdk"),
                  .product(name: "FrakSDKUI", package: "frak-ios-sdk"),
              ])]
          )
          EOF
          printf 'import FrakSDK\nimport FrakSDKUI\npublic func probe() { Frak.initialize(FrakConfig(merchantId: "ci")) }\n' \
            > Sources/App/App.swift
          swift build
          echo "Resolved and built frak-ios-sdk $VERSION" >> "$GITHUB_STEP_SUMMARY"
