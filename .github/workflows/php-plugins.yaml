name: "✅ CI: PHP Plugins"

on:
  push:
    branches: [main, dev]
    paths: ['plugins/**']
  pull_request:
    paths: ['plugins/**']

jobs:
  # ── Magento ─────────────────────────────────────────────
  magento-coding-standard:
    name: "📏 Magento · Coding standard"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/magento
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with: { php-version: '8.4', tools: 'composer:v2', coverage: none }
      - run: composer install --no-interaction --prefer-dist
      - run: composer run cs

  magento-phpstan:
    name: "🔍 Magento · PHPStan"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/magento
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with: { php-version: '8.4', tools: 'composer:v2', coverage: none }
      - run: composer install --no-interaction --prefer-dist
      - run: composer run analyse

  magento-unit-tests:
    name: "🧪 Magento · Unit tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/magento
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with: { php-version: '8.4', tools: 'composer:v2' }
      - run: composer install --no-interaction --prefer-dist
      - run: composer run test

  # ── WordPress ───────────────────────────────────────────
  wordpress-coding-standard:
    name: "📏 WordPress · Coding standard"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/wordpress
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with: { php-version: '8.4', tools: 'composer:v2', coverage: none }
      - run: composer install --no-interaction --prefer-dist
      - run: composer run cs

  wordpress-phpstan:
    name: "🔍 WordPress · PHPStan"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/wordpress
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with: { php-version: '8.4', tools: 'composer:v2', coverage: none }
      - run: composer install --no-interaction --prefer-dist
      - run: composer run analyse

  # ── PrestaShop ──────────────────────────────────────────
  prestashop-coding-standard:
    name: "📏 PrestaShop · Coding standard"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/prestashop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with: { php-version: '8.4', tools: 'composer:v2', coverage: none }
      - run: composer install --no-interaction --prefer-dist
      - run: composer run cs

  prestashop-phpstan:
    name: "🔍 PrestaShop · PHPStan"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/prestashop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with: { php-version: '8.4', tools: 'composer:v2', coverage: none }
      # Cache the cloned PrestaShop 8.2.6 checkout (sources + vendor) so
      # subsequent runs skip the ~30 s clone + ~60 s `composer install` step.
      # The cache key is pinned to the exact PS tag so a tag bump invalidates
      # the cache automatically.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: plugins/prestashop/.cache/prestashop-core
          key: prestashop-core-8.2.6
      - run: composer install --no-interaction --prefer-dist
      - run: composer run analyse

  prestashop-unit-tests:
    name: "🧪 PrestaShop · Unit tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/prestashop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with: { php-version: '8.4', tools: 'composer:v2' }
      - run: composer install --no-interaction --prefer-dist
      - run: composer run test