appId: id.frak.example.ios
name: Share one product, then dismiss the sheet
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Connected"
    timeout: 20000
# Centred, because the first rows otherwise sit under the floating event log and the tap hits it.
- scrollUntilVisible:
    element: "Share this product"
    direction: DOWN
    centerElement: true
- tapOn:
    text: "Share this product"
    index: 0
- extendedWaitUntil:
    visible: "Share with your friends"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: build/maestro/share-product-sheet
- swipe:
    start: 50%, 23%
    end: 50%, 95%
- extendedWaitUntil:
    visible: ".*Sharing sheet dismissed by user\\."
    timeout: 5000
- assertVisible: ".*Opening the share sheet for 'Babies camel cuir velours bout carré'.*"
