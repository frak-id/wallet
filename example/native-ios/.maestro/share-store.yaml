appId: id.frak.example.ios
name: Share the store, then dismiss the sheet
---
- launchApp:
    clearState: true
- assertVisible: "Frak Demo Store"
- extendedWaitUntil:
    visible: "Connected"
    timeout: 20000
- tapOn: "Share the store"
- extendedWaitUntil:
    visible: "Share with your friends"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: build/maestro/share-store-sheet
# From the grabber: a drag over the web content can land as a tap on its buttons.
- swipe:
    start: 50%, 23%
    end: 50%, 95%
- extendedWaitUntil:
    visible: ".*Sharing sheet dismissed by user."
    timeout: 5000
