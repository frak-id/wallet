# XcodeGen spec for the runnable iOS app target.
#
# SwiftPM cannot produce an app bundle, so this spec wraps the same sources in a real
# app target that can run on a simulator.
#
# The `.xcodeproj` is generated, not committed: regenerate with `xcodegen`.
name: FrakExampleiOSApp
options:
  bundleIdPrefix: id.frak.example
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

# Local path package for the real SDK, mirroring Package.swift's dependency. Both must
# agree with the on-disk path at ../../sdk/ios, not the manifest's declared name "FrakSDK".
packages:
  FrakSDK:
    path: ../../sdk/ios

targets:
  FrakExampleiOSApp:
    type: application
    platform: iOS
    sources:
      - path: Sources/FrakExampleiOSApp
        excludes:
          - Info.plist
    dependencies:
      - package: FrakSDK
        product: FrakSDK
      - package: FrakSDK
        product: FrakSDKUI
    settings:
      base:
        # Point at the checked-in plist rather than XcodeGen's `info:` block, which would
        # drop CFBundleURLTypes / LSApplicationQueriesSchemes, needed for deep links and
        # wallet detection.
        INFOPLIST_FILE: Sources/FrakExampleiOSApp/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: id.frak.example.ios
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Signing is scoped by SDK so the two run paths stay independent.
        # Simulator: ad-hoc, no provisioning profile or dev team, so `run`/`build`
        # work on any checkout. Device: real signing, which xcodebuild cannot fake.
        # `scripts/run.sh device` supplies DEVELOPMENT_TEAM and -allowProvisioningUpdates;
        # leaving the team out here keeps a contributor's own team a one-var override.
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY[sdk=iphoneos*]: "Apple Development"
        CODE_SIGNING_REQUIRED[sdk=iphoneos*]: "YES"
        CODE_SIGNING_ALLOWED[sdk=iphoneos*]: "YES"
        CODE_SIGN_STYLE[sdk=iphoneos*]: Automatic
        # The real SDK must be Swift 6 strict-concurrency clean; hold the example app to it.
        SWIFT_VERSION: "6.0"
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
