# Manual integration site: http://localhost:8000. Procedure in ../AGENTS.md.
services:
  db:
    image: mysql:8.0
    volumes:
      - ./db_data:/var/lib/mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: somewordpress
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psomewordpress"]
      interval: 5s
      retries: 20
  wordpress:
    depends_on:
      db:
        condition: service_healthy
    image: wordpress:latest
    volumes:
      - ./wordpress:/var/www/html
      - ..:/var/www/html/wp-content/plugins/frak-integration
    ports:
      - "8000:80"
    restart: always
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
  # One-off WP-CLI: docker compose run --rm cli wp <command>
  cli:
    profiles: ["cli"]
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    image: wordpress:cli
    user: "33:33"
    volumes:
      - ./wordpress:/var/www/html
      - ..:/var/www/html/wp-content/plugins/frak-integration
    environment:
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
