services:
  mysql:
    container_name: some-mysql
    image: mariadb:10.11 # Native arm64 + amd64; mysql:5.7 has no arm64 image
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: prestashop
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - prestashop_network
  prestashop:
    container_name: prestashop
    image: prestashop/prestashop:8.2-apache # Matches the 8.2.x core phpstan analyses against
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - 8080:80
    environment:
      DB_SERVER: some-mysql
      DB_NAME: prestashop
      DB_USER: root
      DB_PASSWD: admin
      PS_INSTALL_AUTO: 1
      PS_DOMAIN: localhost:8080
      PS_FOLDER_ADMIN: admin4577
      PS_FOLDER_INSTALL: install4577
      # demo@prestashop.com
      # password: prestashop_demo
    volumes:
      # The module from this repo; run `composer install` in plugins/prestashop first.
      - ..:/var/www/html/modules/frakintegration
      # The back office rewrites config.xml when it lists modules; keep the tracked file intact.
      - ../config.xml:/var/www/html/modules/frakintegration/config.xml:ro
    networks:
      - prestashop_network
networks:
    prestashop_network:
