api_version = "2026-10"

name = "checkout-web-pixel"
handle = "checkout-web-pixel"
description = "Tells Frak when a customer buys, so rewards can be paid."
uid = "55012454-a101-46ea-c8d6-c82738315af4c9c621a9"
type = "web_pixel_extension"
runtime_context = "strict"

[customer_privacy]
analytics = false
marketing = false
preferences = false
sale_of_data = "disabled"

[capabilities]
network_access = true

[settings]
type = "object"
[settings.fields.backendUrl]
name = "Frak address"
description = "The Frak address that receives order events."
type = "single_line_text_field"
validations = [
  { name = "min", value = "1" }
]

[settings.fields.merchantId]
name = "Frak store ID"
description = "Identifies your store in Frak, so orders are linked to the right store."
type = "single_line_text_field"
