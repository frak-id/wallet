# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "de34932679bc2a2c5a8dddb21a216247"
name = "FrakDev"
application_url = "https://extension-shop-dev.frak.id"
embedded = true
handle = "frakdev"

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-04"

[[webhooks.subscriptions]]
topics = ["app_purchases_one_time/update", "app/uninstalled"]
uri = "/webhooks"
compliance_topics = [
  "customers/data_request",
  "customers/redact",
  "shop/redact",
]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customer_events,read_metaobjects,read_orders,read_pixels,read_products,read_themes,unauthenticated_read_metaobjects,write_metaobject_definitions,write_metaobjects,write_pixels,write_translations"

[access.admin]
direct_api_mode = "online"
embedded_app_direct_api_access = true

[auth]
redirect_urls = [
  "https://extension-shop-dev.frak.id/auth/callback",
  "https://extension-shop-dev.frak.id/auth/shopify/callback",
  "https://extension-shop-dev.frak.id/api/auth/callback",
  # Standalone business dashboard SSO (design doc §4.7) — served by the
  # backend itself, not the embedded app. Both backend hostnames are
  # registered (`backend-dev.frak.id` legacy alias +
  # `backend.gcp-dev.frak.id` primary, see infra/gcp/utils.ts) since dev
  # traffic isn't guaranteed to hit one exclusively.
  "https://backend-dev.frak.id/business/auth/shopify/callback",
  "https://backend.gcp-dev.frak.id/business/auth/shopify/callback",
  # Local backend dev (design doc §4.7 SSO). The redirect_uri is derived
  # from the live request host (api/business/auth/shopify.ts callbackUrl),
  # so a backend running on localhost:3030 emits this exact URL.
  "https://localhost:3030/business/auth/shopify/callback",
]

[pos]
embedded = false
