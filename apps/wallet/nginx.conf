server {
    listen       80;
    server_name  localhost;

    # Enable sendfile for efficient file serving
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Cache open file descriptors (improves performance significantly)
    # inactive=20s means unused files are removed after 20s
    # This is safe during deployments because each pod has its own cache
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Serve pre-compressed .gz files if available (from build process)
    gzip_static on;
    
    # Enable real-time gzip compression as fallback
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/x-font-ttf font/opentype image/svg+xml image/x-icon;

    include /etc/nginx/security-headers.conf;

    # Service worker with no cache (must always be fresh)
    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header Service-Worker-Allowed "/";
        include /etc/nginx/security-headers.conf;
    }

    # Unhashed (public/), so it must not fall into the immutable rule below
    location = /boot.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    # Static assets with aggressive caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        include /etc/nginx/security-headers.conf;
    }

    # Standalone entrypoints — NOT the SPA.
    #
    # `/sharing` and `/install` are their own Vite build (see
    # `vite.standalone.config.ts`): full-page loads from the web SDK, the
    # iOS/Android SDK web views and Shopify's post-purchase card, which need
    # none of the wallet shell. Serving `index.html` here would boot the whole
    # SPA (~390 KB gz) to render two buttons.
    #
    # Exact-match locations rather than a `try_files` entry in `location /`,
    # because the SPA fallback would otherwise win the moment one of these
    # files is missing — silently un-optimising an SDK-critical path instead of
    # failing visibly. `=404` makes a broken build loud.
    #
    # The corresponding SPA routes still exist and still work: Tauri and
    # client-side navigations use them. Only this origin's direct hits are
    # rerouted.
    location = /sharing {
        root /usr/share/nginx/html;
        try_files /sharing.html =404;

        # Same no-store policy as the SPA's HTML: the document names hashed
        # asset URLs, so a cached copy outlives its chunks.
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        etag off;

        include /etc/nginx/security-headers.conf;
    }

    # A trailing slash misses an exact match, and the SPA fallback would boot
    # ~390 KB of shell to render the redirect stub — worse, an embedded launch
    # errors in the router's beforeLoad before that stub ever runs. Redirect
    # here instead; the query survives via $is_args$args and the fragment
    # never reaches the server, so per-tap params are preserved.
    location = /sharing/ {
        return 301 /sharing$is_args$args;
    }

    location = /install {
        root /usr/share/nginx/html;
        try_files /install.html =404;

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        etag off;

        include /etc/nginx/security-headers.conf;
    }

    location = /install/ {
        return 301 /install$is_args$args;
    }

    # Short `/install` alias for the ambassador QR. Also mapped in
    # `app/utils/deepLink.ts`, which handles it once the app is installed.
    location = /i {
        root /usr/share/nginx/html;
        try_files /install.html =404;

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        etag off;

        include /etc/nginx/security-headers.conf;
    }

    location = /i/ {
        return 301 /i$is_args$args;
    }

    # Short referral QR alias: `/r/<CODE>` → `/install?ref=<CODE>`. Case-
    # insensitive so a fully uppercase URL stays in the QR alphanumeric mode;
    # `/install` validates and uppercases the code. A malformed code still
    # lands on the install page, just without a prefill. Relative Location:
    # TLS ends at the ingress, so an absolute one would say `http://`.
    # Quoted: an unquoted `{6}` opens an nginx block and fails `nginx -t`.
    location ~* "^/r/([a-z0-9]{6})/?$" {
        absolute_redirect off;
        return 302 /install?ref=$1;
    }

    location ~* ^/r(/|$) {
        absolute_redirect off;
        return 302 /install;
    }

    # Main app - SPA routing
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/index.html /index.html;

        # Cache control for HTML (no cache, no etag to prevent stale content)
        location ~ \.html$ {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Expires "0";
            etag off;
            include /etc/nginx/security-headers.conf;
        }
    }
}
