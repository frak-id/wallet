# Security headers, included wherever a block declares an `add_header` of its own.
#
# nginx inherits `add_header` from an enclosing block ONLY when the current block declares
# none at all. One `add_header Cache-Control …` in a location silently drops every header
# below, so each such block includes this file rather than restating it.
#
# Included at server level too, so this file is the single definition.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Keep window.opener alive for the SSO popup flow. The popup lives at wallet.frak.id/sso
# and must reach window.opener.frames to find the listener iframe (findIframeInOpener).
# "unsafe-none" is the browser default today but we set it explicitly so a future default
# flip to "same-origin-allow-popups" (which severs cross-origin openers) does not silently
# break Shopify and other iframe-embedded integrations.
add_header Cross-Origin-Opener-Policy "unsafe-none" always;
