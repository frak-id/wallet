<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta
            id="viewport"
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
        >
        <!-- Must stay blocking and right after #viewport; see the file. -->
        <script src="/boot.js"></script>
        <!-- #boot-splash: Tauri only, driven by app/utils/bootSplash.ts. Same logo,
             size and position as the native launch screens, so the hand-over is invisible. -->
        <style>
        #boot-splash {
            --boot-logo-size: 120px;
            display: none;
        }
        :root[data-platform="tauri"] #boot-splash:not([hidden]) {
            position: fixed;
            inset: 0;
            z-index: 2147483647;
            display: block;
            background: #ffffff;
            transition: opacity 0.2s ease-out;
        }
        :root[data-os="android"] #boot-splash {
            --boot-logo-size: 90px;
        }
        #boot-splash[data-leaving] {
            opacity: 0;
            pointer-events: none;
        }
        .boot-splash-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            width: var(--boot-logo-size);
            height: var(--boot-logo-size);
            transform: translate(-50%, -50%);
        }
        .boot-splash-status {
            position: absolute;
            top: calc(50% + var(--boot-logo-size) / 2 + 40px);
            right: 24px;
            left: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            opacity: 0;
            transition: opacity 0.25s ease-out;
        }
        .boot-splash-status[data-visible] {
            opacity: 1;
        }
        .boot-splash-text {
            margin: 0;
            color: #525252;
            font:
                500 14px / 20px "Inter",
                "Inter Fallback",
                sans-serif;
            text-align: center;
        }
        .boot-splash-track {
            position: relative;
            width: 96px;
            height: 3px;
            overflow: hidden;
            border-radius: 999px;
            background: #e5ecfd;
        }
        .boot-splash-bar {
            position: absolute;
            inset: 0 auto 0 0;
            width: 30%;
            border-radius: 999px;
            background: #0043ef;
            animation: boot-splash-slide 1.5s linear infinite;
        }
        @keyframes boot-splash-slide {
            from {
                transform: translateX(-100%);
            }
            to {
                transform: translateX(340%);
            }
        }
        @media (prefers-reduced-motion: reduce) {
            .boot-splash-bar {
                width: 100%;
                opacity: 0.4;
                animation: none;
            }
        }
        </style>

        <!-- Primary Meta Tags -->
        <title>Frak Wallet | Your Web3 Identity & Reward Hub</title>
        <meta name="application-name" content="Frak Wallet">
