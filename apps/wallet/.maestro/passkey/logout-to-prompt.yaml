appId: id.frak.wallet.dev
name: Log out, then wait for the passkey sheet
---
# Run by e2e-{android,ios}.sh only, which then answer the biometric check from the script.
- launchApp
- extendedWaitUntil:
    visible: "Rewards"
    timeout: 30000
    label: "Wallet home loaded (if this fails, log in by hand on this device first)"
- tapOn: "Profile"
- extendedWaitUntil:
    visible: "Referrals"
    timeout: 10000
- scrollUntilVisible:
    element: "Logout"
    direction: DOWN
- tapOn: "Logout"
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: ".*needs to verify it.s you.*"
          timeout: 20000
          label: "Google Password Manager asks for the screen lock"
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "Use Passkey"
          timeout: 20000
          label: "iOS offers the simulator's passkey"
      - tapOn: "Use Passkey"
