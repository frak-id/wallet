appId: id.frak.wallet.dev
name: Log out, then wait for the passkey sheet
---
# Run by e2e-{android,ios}.sh only, which then answer the biometric check from the script.
# App texts match English|French; the system sheets follow the device language.
- launchApp
- extendedWaitUntil:
    visible: "Rewards|Total balance"
    timeout: 30000
    label: "Wallet home loaded (if this fails, log in by hand on this device first)"
- tapOn: "Profile|Profil"
- extendedWaitUntil:
    visible: "Referrals|Parrainages"
    timeout: 10000
- scrollUntilVisible:
    element: "Logout|Déconnexion"
    direction: DOWN
- tapOn: "Logout|Déconnexion"
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible:
            id: "com.android.systemui:id/biometric_icon"
          timeout: 20000
          label: "Google Password Manager asks for the screen lock"
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "Use Passkey|Utiliser la clé d.accès"
          timeout: 20000
          label: "iOS offers the simulator's passkey"
      - tapOn: "Use Passkey|Utiliser la clé d.accès"
