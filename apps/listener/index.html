<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/x-icon" href="/favicon.ico">
        <title>Frak Listener</title>
        <meta name="application-name" content="Frak Listener">
        <meta
            name="description"
            content="Frak Listener - iframe component for wallet interactions"
        >

        <!-- Warm DNS only (not preconnect) for the idle boot ping in bootstrap.ts -->
        <link rel="dns-prefetch" href="https://metrics.frak.id">

        <!-- Inter @font-face is inlined by the inlineFontFaces Vite plugin (vite.config.ts) -->

        <!-- A throw or a failed script load kills bootstrap() before analytics exists; the SDK reports the last error it sees before connecting -->
        <script>
        addEventListener(
            "error",
            (event) => {
                const target = event.target;
                let message;
                // A failed load fires on the element and does not bubble, hence the capture phase
                if (target instanceof HTMLScriptElement) {
                    message = `Failed to load ${target.src}`;
                } else if (target instanceof HTMLLinkElement) {
                    message = `Failed to load ${target.href}`;
                } else if (event instanceof ErrorEvent) {
                    message = String(event.message);
                } else {
                    return;
                }
                parent.postMessage(
                    { iframeLifecycle: "boot-error", data: { message } },
                    "*"
                );
            },
            true
        );
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/app/entry.client.ts"></script>
    </body>
</html>
