# Security headers optimized for iframe-only usage.
# X-Frame-Options omitted - using CSP frame-ancestors instead (more flexible).
# Included in the server block AND in every location that declares its own
# add_header, since add_header in a location suppresses inherited headers.
add_header Content-Security-Policy "frame-ancestors *; object-src 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Allow parent page to access resource timing (performance monitoring)
add_header Timing-Allow-Origin "*" always;
