distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Gradle 9.5.0, not the newest 9.6.x. This is the top of the window that the
# Kotlin Gradle plugin 2.4.10 lists as fully supported (7.6.3–9.5.0); past it,
# KGP only promises "works, but expect deprecation warnings". AGP 9.1 requires
# at least 9.3.1, so 9.5.0 satisfies both with no deviation from either matrix.
#
# The old note here justified 8.14.3 on the grounds that Gradle only gained Java
# 24 daemon support in the 8.14 line. That is moot now: Gradle 9.x runs on any
# JVM from 17 to 26, so the launching JDK no longer constrains the wrapper.
distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.0-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
