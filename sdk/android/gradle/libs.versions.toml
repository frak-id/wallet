# Version catalog for the Frak Android SDK.
# Runtime dependencies stay first-party (Kotlin, AndroidX); anything else is test-only.

[versions]
agp = "9.1.1"
kotlin = "2.4.10"
ktlint-plugin = "14.2.0"
# Named `ktlint-engine`, not `ktlint`: a bare `ktlint` key is a prefix of `ktlint-plugin`, so
# Gradle would generate a group accessor with no `.get()`.
ktlint-engine = "1.8.0"

# Also declared in buildSrc/build.gradle.kts, which cannot read this catalog — keep them in step by hand.
bcv = "0.18.1"
# BCV's ABI worker needs these at runtime; also declared in buildSrc/build.gradle.kts.
# `kotlin-metadata` must track the `kotlin` version above.
kotlin-metadata = "2.4.10"
asm = "9.9"


coroutines = "1.11.0"

compose-bom = "2026.06.01"

androidx-webkit = "1.16.0"

# Not the latest: `compileSdk` is 36 here, and androidx artifacts built against 37 fail with `minCompileSdk`.
# androidx.lifecycle is deliberately not declared: it arrives as an api dep of activity; 2.11.0 needs compileSdk 37.
androidx-activity = "1.13.0"

androidx-annotation = "1.9.1"

# `compileOnly` on :frak-sdk for androidx.core.app.OnNewIntentProvider, so it stays out of the POM
# and the module keeps its zero-runtime-dependency promise. 1.19.0 needs compileSdk 37.
androidx-core = "1.18.0"

junit = "4.13.2"
# Test-only. Do not drop it as "org.json ships with Android": unit tests compile against the stubbed
# `android.jar`, whose methods throw `Method ... not mocked`; the real artifact shadows the stub.
json = "20260719"

# Test-only, `:frak-sdk-ui` only: a real Android runtime on the JVM instead of the stubbed `android.jar`.
robolectric = "4.16.1"
androidx-test-core = "1.7.0"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }


compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }

androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "androidx-webkit" }
androidx-activity = { module = "androidx.activity:activity", version.ref = "androidx-activity" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidx-annotation" }
androidx-core = { module = "androidx.core:core", version.ref = "androidx-core" }

junit = { module = "junit:junit", version.ref = "junit" }
json = { module = "org.json:json", version.ref = "json" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
# `org.jetbrains.kotlin.android` is deliberately absent: AGP 9 ships built-in Kotlin and registers its
# own `kotlin` extension, so applying it too fails. This `kotlin` version only feeds the Compose plugin.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-plugin" }
