org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Single source of truth for the published version of BOTH artifacts. They ship
# in lockstep, so they are never versioned apart.
#
# `FrakSdkVersion.CURRENT` must agree with this: it rides on the wire as the
# `x-frak-sdk-version` header and the `?sdkVersion=` param (01 §1.5), so a mismatch
# would have a merchant's binary reporting a version that does not exist. The
# `checkSdkVersionMatchesArtifact` task in each module's build script fails the
# build if they drift, rather than trusting anyone to remember.
frak.sdk.version=0.0.1

# App-size budget per artifact, enforced by `checkDexSizeBudget`.
# Measured as dex, not AAR: an AAR carries debug info and Kotlin metadata that
# never reaches a device, so it reads ~25% high. Raise this only as a deliberate
# decision, never to make a red build green.
#
# 384 KB = the first measured figure (`:frak-sdk` 321 KB, `:frak-sdk-ui` 162 KB) plus ~20% headroom.
# The earlier 150 and 256 were both guesses written before this gate had ever run.
#
# If it goes red, look for a new dependency or subsystem: the weight is spread evenly across core,
# config, tracking, rewards, net, identity and sharing, with no single fat component to trim.
frak.sdk.dexBudgetKb=384

android.useAndroidX=true

# Namespaced, non-transitive R classes. Mandatory hygiene for a library: without
# it the SDK's R class would leak every dependency's resource ids into merchant
# builds and inflate the merged R.
android.nonTransitiveRClass=true

kotlin.code.style=official

# Turn off the AGP build features this project has no use for. Each one that
# stays on costs a task per module per variant, and a library that generates
# resources or BuildConfig it never reads only makes the AAR bigger.
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
