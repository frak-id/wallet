org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Single source of truth for the published version of BOTH artifacts; they ship in lockstep.
# `FrakSdkVersion.CURRENT` must agree — it rides on the wire as the `x-frak-sdk-version` header,
# and `checkSdkVersionMatchesArtifact` fails the build on drift.
frak.sdk.version=0.0.1

# App-size budget per artifact, enforced by `checkDexSizeBudget`. Measured as dex, not AAR: an AAR
# carries debug info and Kotlin metadata that never reaches a device, so it reads ~25% high.
# 384 KB is the first measured figure plus ~20% headroom.
frak.sdk.dexBudgetKb=384

android.useAndroidX=true

# Without this the SDK's R class would leak every dependency's resource ids into merchant builds.
android.nonTransitiveRClass=true

kotlin.code.style=official

# AGP build features this library has no use for; each one costs a task per module per variant.
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
